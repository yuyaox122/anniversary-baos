<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Seventh</title>
<meta name="description" content="Counting down to the seventh of every month, since 7 October 2025.">
<meta name="theme-color" content="#F2C8D4">

<!-- so the link shows the bear when you send it to her -->
<meta property="og:type" content="website">
<meta property="og:title" content="The Seventh">
<meta property="og:description" content="Counting down to the seventh of every month.">
<meta property="og:image" content="assets/rose.gif">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="180x180" href="assets/favicon-180.png">
<link rel="apple-touch-icon" href="assets/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Parisienne&display=swap">

<style>
  :root {
    --bg:     #F2C8D4;
    --paper:  #FFFAFB;
    --ink:    #4A2632;
    --soft:   #9B7480;
    --rose:   #B8324E;
    --tape:   rgba(255,255,255,0.5);

    --script: 'Parisienne', 'Snell Roundhand', 'Apple Chancery', cursive;
    --serif:  'Cormorant Garamond', 'Iowan Old Style', Georgia, serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--script);
    font-size: 26px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    display: grid;
    justify-items: center;
    align-content: center;
    min-height: 100vh;
    padding: clamp(24px, 6vw, 60px) 16px;
  }

  #hearts { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }

  /* ---------- the card ---------- */
  .sheet {
    position: relative;
    z-index: 1;
    width: min(560px, 100%);
    background: var(--paper);
    padding: clamp(38px, 7vw, 56px) clamp(26px, 6vw, 52px) clamp(34px, 6vw, 46px);
    transform: rotate(-0.4deg);
    box-shadow: 0 1px 2px rgba(90,40,55,0.10), 0 16px 38px rgba(120,50,70,0.16);
  }

  .tape {
    position: absolute;
    width: 92px; height: 26px;
    background: var(--tape);
    box-shadow: 0 1px 1px rgba(90,40,55,0.08);
  }
  .tape.tl { top: -12px; left: 22px; transform: rotate(-4deg); }
  .tape.tr { top: -14px; right: 26px; transform: rotate(3.5deg); }

  /* ---------- header ---------- */
  header {
    display: grid;
    grid-template-columns: 1fr auto;
    align-items: start;
    gap: 16px;
  }

  .since {
    margin: 0 0 6px;
    font-family: var(--serif);
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    line-height: 1.4;
    color: var(--soft);
  }

  h1 {
    margin: 0;
    font-weight: 400;
    font-size: clamp(46px, 12vw, 66px);
    line-height: 1.08;
    max-width: 10ch;
  }
  h1 .today { color: var(--rose); }

  /* the bear, taped on crooked */
  .taped {
    position: relative;
    margin: 2px -4px 0 0;
    padding: 10px 10px 12px;
    background: #fff;
    box-shadow: 0 1px 2px rgba(90,40,55,0.12), 0 8px 18px rgba(120,50,70,0.14);
    transform: rotate(3deg);
    border: none;
    cursor: pointer;
    display: block;
  }
  .taped::after {
    content: "";
    position: absolute;
    top: -11px; left: 50%;
    width: 62px; height: 22px;
    margin-left: -31px;
    background: var(--tape);
    transform: rotate(-2deg);
  }
  .taped:focus-visible { outline: 2px solid var(--rose); outline-offset: 6px; }
  .taped img {
    display: block;
    width: 132px; height: 132px;
    transition: transform 240ms cubic-bezier(.34,1.56,.64,1);
  }
  .taped:hover img, .taped:active img { transform: rotate(-3deg) scale(1.03); }

  /* ---------- the counter ---------- */
  .slip {
    position: relative;
    display: inline-block;
    margin: 34px 0 12px;
    padding: 14px 24px 16px;
    border: 1px solid rgba(184,50,78,0.22);
    transform: rotate(-0.6deg);
  }
  .slip .label {
    margin: 0 0 8px;
    font-family: var(--serif);
    font-size: 12px;
    letter-spacing: 0.16em;
    line-height: 1.2;
    color: var(--soft);
  }
  .clock {
    display: flex;
    align-items: baseline;
    gap: 16px;
    font-family: var(--serif);
  }
  .clock div { display: flex; align-items: baseline; gap: 5px; }
  .clock b {
    font-size: clamp(30px, 8vw, 40px);
    font-weight: 500;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .clock span {
    font-size: 12px;
    letter-spacing: 0.1em;
    color: var(--soft);
  }

  .aside {
    display: inline-block;
    margin-left: 16px;
    font-size: 24px;
    color: var(--rose);
    transform: rotate(-4deg);
    white-space: nowrap;
  }

  .tally {
    margin: 10px 0 0;
    font-size: 27px;
    line-height: 1.45;
  }

  footer {
    display: block;
    margin-top: 30px;
    font-size: 34px;
    line-height: 1.3;
    color: var(--rose);
    transform: rotate(-1.5deg);
  }

  @media (max-width: 460px) {
    header { grid-template-columns: 1fr; }
    .taped { justify-self: start; margin: 12px 0 0; }
    .taped img { width: 108px; height: 108px; }
    .aside { display: block; margin: 10px 0 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<canvas id="hearts" aria-hidden="true"></canvas>

<div class="sheet">
  <span class="tape tl" aria-hidden="true"></span>
  <span class="tape tr" aria-hidden="true"></span>

  <header>
    <div>
      <p class="since" id="since">since 7 october 2025</p>
      <h1 id="headline">counting</h1>
    </div>
    <button class="taped" id="roseBtn" aria-label="Scatter some hearts">
      <img id="rose" src="assets/rose.gif" alt="A little bear holding a rose" width="132" height="132">
    </button>
  </header>

  <div class="slip">
    <p class="label" id="untilLabel">next one in</p>
    <div class="clock">
      <div><b id="d">--</b><span>days</span></div>
      <div><b id="h">--</b><span>hrs</span></div>
      <div><b id="m">--</b><span>min</span></div>
      <div><b id="s">--</b><span>sec</span></div>
    </div>
  </div>
  <span class="aside">juicy</span>

  <p class="tally" id="tally">&nbsp;</p>

  <footer>love you xiao bao</footer>
</div>

<script>
/* the only thing you should need to change */
const CONFIG = {
  start: { year: 2025, month: 10, day: 7 }   // month is 1-12
};

const WORDS = ["zero","one","two","three","four","five","six","seven","eight","nine","ten",
  "eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen","twenty",
  "twenty-one","twenty-two","twenty-three","twenty-four"];

const MONTHS = ["january","february","march","april","may","june",
  "july","august","september","october","november","december"];

const START = new Date(CONFIG.start.year, CONFIG.start.month - 1, CONFIG.start.day);
const DAY_MS = 86400000;

const midnight = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const daysBetween = (a, b) => Math.round((midnight(b) - midnight(a)) / DAY_MS);
const longDate = d => d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear();
const pad = n => String(n).padStart(2, "0");

/* whole months elapsed, plus the leftover days */
function elapsed(to) {
  let months = (to.getFullYear() - START.getFullYear()) * 12 + (to.getMonth() - START.getMonth());
  let anchor = new Date(START.getFullYear(), START.getMonth() + months, START.getDate());
  if (anchor > midnight(to)) {
    months -= 1;
    anchor = new Date(START.getFullYear(), START.getMonth() + months, START.getDate());
  }
  return { months, days: daysBetween(anchor, to) };
}

/* the next seventh, at midnight. today's own seventh doesn't count. */
function nextAnniversary(now) {
  const d = CONFIG.start.day;
  let target = new Date(now.getFullYear(), now.getMonth(), d);
  if (midnight(now) >= target) target = new Date(now.getFullYear(), now.getMonth() + 1, d);
  return target;
}

document.getElementById("since").textContent = "since " + longDate(START);

const el = { d: document.getElementById("d"), h: document.getElementById("h"),
             m: document.getElementById("m"), s: document.getElementById("s") };

function tick() {
  const now = new Date();
  const left = Math.max(0, nextAnniversary(now) - now);

  el.d.textContent = Math.floor(left / DAY_MS);
  el.h.textContent = pad(Math.floor(left / 3600000) % 24);
  el.m.textContent = pad(Math.floor(left / 60000) % 60);
  el.s.textContent = pad(Math.floor(left / 1000) % 60);

  const e = elapsed(now);
  const isToday = now.getDate() === CONFIG.start.day;
  const word = WORDS[e.months] || e.months;

  document.getElementById("headline").innerHTML = e.months < 1
    ? "our first month"
    : (isToday ? word + ' months <span class="today">today</span>'
               : word + " months of you");

  document.getElementById("untilLabel").textContent = isToday ? "it's today. next one in" : "next one in";

  document.getElementById("tally").innerHTML =
    "<b>" + daysBetween(START, now) + "</b> days farting together =))";
}
tick();
setInterval(tick, 1000);

/* hearts raining down */
(function () {
  const canvas = document.getElementById("hearts");
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    canvas.style.display = "none";
    return;
  }

  const ctx = canvas.getContext("2d");
  const BASE = 22;
  let w, h, hearts = [];

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  const TINTS = ["rgba(168,38,66,", "rgba(198,72,102,", "rgba(226,116,142,"];

  /* two mirrored beziers: notch at the top, point at the bottom */
  function heartPath(s) {
    ctx.beginPath();
    ctx.moveTo(0, -s * 0.25);
    ctx.bezierCurveTo(-s * 0.50, -s * 0.95, -s * 1.15, s * 0.15, 0, s * 0.80);
    ctx.bezierCurveTo( s * 1.15,  s * 0.15,  s * 0.50, -s * 0.95, 0, -s * 0.25);
    ctx.closePath();
  }

  function heart(fromTop) {
    return {
      x: Math.random() * w,
      y: fromTop ? -24 : Math.random() * h,
      s: 6 + Math.random() * 6,
      vy: 0.28 + Math.random() * 0.5,
      drift: 0.4 + Math.random() * 0.9,
      phase: Math.random() * Math.PI * 2,
      sway: 0.18 + Math.random() * 0.3,
      alpha: 0.34 + Math.random() * 0.38,
      tint: TINTS[(Math.random() * TINTS.length) | 0]
    };
  }

  function burst(cx, cy, n) {
    for (let i = 0; i < n; i++) {
      const p = heart(false);
      p.x = cx + (Math.random() - 0.5) * 40;
      p.y = cy + (Math.random() - 0.5) * 40;
      p.vy = 0.6 + Math.random() * 1.2;
      p.alpha = 0.6 + Math.random() * 0.35;
      hearts.push(p);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (const p of hearts) {
      p.y += p.vy;
      p.phase += 0.016;
      p.x += Math.sin(p.phase) * p.drift;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(Math.sin(p.phase) * p.sway);   /* a gentle tilt, not a tumble */
      ctx.fillStyle = p.tint + p.alpha + ")";
      heartPath(p.s);
      ctx.fill();
      ctx.restore();
    }
    hearts = hearts.filter(p => p.y < h + 30);
    while (hearts.length < BASE) hearts.push(heart(true));
    requestAnimationFrame(draw);
  }

  resize();
  window.addEventListener("resize", resize);
  for (let i = 0; i < BASE; i++) hearts.push(heart(false));
  requestAnimationFrame(draw);

  document.getElementById("roseBtn").addEventListener("click", e => {
    const b = e.currentTarget.getBoundingClientRect();
    burst(b.left + b.width / 2, b.top + b.height / 2, 26);
  });

  if (new Date().getDate() === CONFIG.start.day) {
    setTimeout(() => burst(window.innerWidth / 2, window.innerHeight * 0.28, 40), 400);
  }
})();
</script>
</body>
</html>
